id: linux/restless-worker
name: The Restless Worker
image: images:debian/13
dependencies:
  packages:
    - python3
mission: |
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          THE RESTLESS WORKER
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  Black Mesa's processing worker has become unstable.

  Monitoring reports that jobs are no longer being
  processed reliably, although the service repeatedly
  appears to come back online.

  MISSION

  Investigate the worker and restore stable job
  processing.

  CONSTRAINTS

  Do not replace the supplied worker application.

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

