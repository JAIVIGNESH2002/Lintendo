mission: |
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          THE FORBIDDEN CONFIG
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  Black Mesa's telemetry service stopped working
  immediately after a routine deployment.

  Operations confirmed that the application and its
  configuration file are still present.

  MISSION

  Investigate the failure and restore the telemetry service.

  CONSTRAINTS

  Do not replace the supplied application.
  Do not replace the configuration file.

